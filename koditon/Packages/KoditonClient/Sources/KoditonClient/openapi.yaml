components:
  examples:
    OAuthClientRegistrationRequestDefault:
      value:
        client_name: ChatGPT MCP Client
        logo_uri: https://chatgpt.com/favicon.ico
        redirect_uris:
          - https://chat.openai.com/aip/callback
        scope: mcp:core:read
        token_endpoint_auth_method: none
    OAuthDeviceAuthorizationRequestDefault:
      value:
        client_id: koditon-cli
        scope: mcp:core:read
    OAuthRevokeRequestDefault:
      value:
        token: refresh-token-value
        token_type_hint: refresh_token
    OAuthTokenRequestAuthorizationCode:
      value:
        client_id: koditon-apple
        code: auth-code-value
        code_verifier: pkce-verifier
        grant_type: authorization_code
        redirect_uri: koditon://oauth/callback
    OAuthTokenRequestDeviceCode:
      value:
        client_id: koditon-cli
        device_code: device-code-value
        grant_type: urn:ietf:params:oauth:grant-type:device_code
    OAuthTokenRequestRefreshToken:
      value:
        client_id: koditon-apple
        grant_type: refresh_token
        refresh_token: refresh-token-value
  requestBodies:
    OAuthClientRegistrationRequest:
      content:
        application/json:
          examples:
            default:
              $ref: "#/components/examples/OAuthClientRegistrationRequestDefault"
          schema:
            properties:
              client_name:
                type: string
              logo_uri:
                format: uri
                type: string
              redirect_uris:
                items:
                  type: string
                type: array
              scope:
                type: string
              token_endpoint_auth_method:
                enum:
                  - none
                type: string
            required:
              - redirect_uris
            type: object
      required: true
    OAuthDeviceAuthorizationRequest:
      content:
        application/x-www-form-urlencoded:
          examples:
            device_authorization_default:
              $ref: "#/components/examples/OAuthDeviceAuthorizationRequestDefault"
          schema:
            properties:
              client_id:
                description: OAuth client ID.
                type: string
              client_secret:
                description: OAuth client secret for confidential clients.
                type: string
              resource:
                description: Protected resource identifier from discovery metadata.
                type: string
              scope:
                description: Requested scopes separated by spaces.
                type: string
            required:
              - client_id
            type: object
      required: true
    OAuthHandoffDecisionRequest:
      content:
        application/json:
          schema:
            properties:
              handoff_id:
                description: Authorization handoff identifier.
                format: uuid
                type: string
            required:
              - handoff_id
            type: object
      required: true
    OAuthHandoffResolveRequest:
      content:
        application/json:
          schema:
            properties:
              handoff_token:
                description: Authorization handoff token from the browser or app link.
                type: string
              user_code:
                description: User-entered handoff code.
                type: string
            type: object
      required: true
    OAuthRevokeRequest:
      content:
        application/x-www-form-urlencoded:
          examples:
            default:
              $ref: "#/components/examples/OAuthRevokeRequestDefault"
          schema:
            properties:
              token:
                description: The token to revoke.
                type: string
              token_type_hint:
                description: "Optional hint: 'refresh_token' or 'access_token'."
                type: string
            required:
              - token
            type: object
      required: true
    OAuthTokenRequest:
      content:
        application/x-www-form-urlencoded:
          examples:
            authorization_code:
              $ref: "#/components/examples/OAuthTokenRequestAuthorizationCode"
            device_code:
              $ref: "#/components/examples/OAuthTokenRequestDeviceCode"
            refresh_token:
              $ref: "#/components/examples/OAuthTokenRequestRefreshToken"
          schema:
            properties:
              client_id:
                description: OAuth client ID.
                type: string
              client_secret:
                description: OAuth client secret for confidential clients.
                type: string
              code:
                description: Authorization code.
                type: string
              code_verifier:
                description: PKCE verifier.
                type: string
              device_code:
                description: Device code.
                type: string
              grant_type:
                enum:
                  - authorization_code
                  - refresh_token
                  - urn:ietf:params:oauth:grant-type:device_code
                type: string
              redirect_uri:
                description: Redirect URI matching authorization request.
                type: string
              refresh_token:
                description: Refresh token.
                type: string
              resource:
                description: Protected resource identifier from discovery metadata.
                type: string
              scope:
                description: Requested scopes separated by spaces.
                type: string
            required:
              - grant_type
            type: object
      required: true
  responses:
    OAuthAuthorizationServerMetadata:
      content:
        application/json:
          schema:
            properties:
              authorization_endpoint:
                description: Authorization endpoint URL.
                type: string
              code_challenge_methods_supported:
                items:
                  type: string
                type: array
              device_authorization_endpoint:
                description: Device authorization endpoint URL.
                type: string
              grant_types_supported:
                items:
                  type: string
                type: array
              issuer:
                description: Authorization server issuer.
                type: string
              jwks_uri:
                description: JWKS endpoint URL.
                type: string
              registration_endpoint:
                description: Dynamic client registration endpoint URL.
                type: string
              response_types_supported:
                items:
                  type: string
                type: array
              revocation_endpoint:
                description: Token revocation endpoint URL (RFC 7009).
                type: string
              scopes_supported:
                items:
                  type: string
                type: array
              token_endpoint:
                description: Token endpoint URL.
                type: string
              token_endpoint_auth_methods_supported:
                items:
                  type: string
                type: array
            required:
              - issuer
              - authorization_endpoint
              - token_endpoint
              - device_authorization_endpoint
              - jwks_uri
              - scopes_supported
              - response_types_supported
              - grant_types_supported
              - token_endpoint_auth_methods_supported
              - code_challenge_methods_supported
            type: object
      description: OAuth authorization server metadata.
    OAuthClientRegistrationSuccess:
      content:
        application/json:
          schema:
            properties:
              client_id:
                type: string
              client_id_issued_at:
                format: int64
                type: integer
              client_name:
                type: string
              grant_types:
                items:
                  type: string
                type: array
              logo_uri:
                format: uri
                type: string
              redirect_uris:
                items:
                  type: string
                type: array
              response_types:
                items:
                  type: string
                type: array
              scope:
                type: string
              token_endpoint_auth_method:
                type: string
            required:
              - client_id
              - client_id_issued_at
              - redirect_uris
              - token_endpoint_auth_method
              - grant_types
              - response_types
              - scope
            type: object
      description: OAuth dynamic client registration response.
    OAuthDeviceAuthorizationSuccess:
      content:
        application/json:
          schema:
            properties:
              device_code:
                description: Device code for token polling.
                type: string
              expires_in:
                description: Expiration in seconds.
                format: int64
                type: integer
              interval:
                description: Recommended polling interval in seconds.
                format: int64
                type: integer
              user_code:
                description: User-entered verification code.
                type: string
              verification_uri:
                description: Verification URL for user interaction.
                type: string
              verification_uri_complete:
                description: Verification URL with user code prefilled.
                type: string
            required:
              - device_code
              - user_code
              - verification_uri
              - verification_uri_complete
              - expires_in
              - interval
            type: object
      description: OAuth device authorization response.
    OAuthError:
      content:
        application/json:
          schema:
            properties:
              error:
                description: OAuth error code.
                type: string
              error_code:
                description: Optional app-specific error code.
                type: string
              error_description:
                description: Human-readable OAuth error description.
                type: string
            required:
              - error
              - error_description
            type: object
      description: OAuth error response.
    OAuthHandoffApproveSuccess:
      content:
        application/json:
          schema:
            properties:
              ok:
                type: boolean
              redirect_url:
                description: OAuth redirect URL with the generated authorization code.
                type: string
            required:
              - ok
              - redirect_url
            type: object
      description: OAuth authorization handoff approval response.
    OAuthHandoffDenySuccess:
      content:
        application/json:
          schema:
            properties:
              ok:
                type: boolean
            required:
              - ok
            type: object
      description: OAuth authorization handoff denial response.
    OAuthHandoffResolveSuccess:
      content:
        application/json:
          schema:
            properties:
              client_display_name:
                description: Display name for the OAuth client.
                type: string
              client_id:
                description: OAuth client ID.
                type: string
              expires_at_unix:
                format: int64
                type: integer
              handoff_id:
                format: uuid
                type: string
              redirect_host:
                description: Redirect URI host.
                type: string
              scopes:
                items:
                  type: string
                type: array
            required:
              - handoff_id
              - client_id
              - client_display_name
              - redirect_host
              - scopes
              - expires_at_unix
            type: object
      description: OAuth authorization handoff response.
    OAuthJWKS:
      content:
        application/json:
          schema:
            properties:
              keys:
                items:
                  additionalProperties: true
                  type: object
                type: array
            required:
              - keys
            type: object
      description: OAuth JWKS response.
    OAuthProtectedResourceMetadata:
      content:
        application/json:
          schema:
            properties:
              authorization_servers:
                items:
                  type: string
                type: array
              bearer_methods_supported:
                items:
                  type: string
                type: array
              resource:
                description: Protected resource identifier.
                type: string
              resource_name:
                description: Display name for the protected resource.
                type: string
              scopes_supported:
                items:
                  type: string
                type: array
            required:
              - resource
              - authorization_servers
              - scopes_supported
              - bearer_methods_supported
              - resource_name
            type: object
      description: OAuth protected resource metadata.
    OAuthTokenSuccess:
      content:
        application/json:
          schema:
            properties:
              access_token:
                description: Bearer access token.
                type: string
              expires_in:
                description: Access token expiration in seconds.
                format: int64
                type: integer
              refresh_token:
                description: Refresh token.
                type: string
              refresh_token_expires_in:
                description: Refresh token expiration in seconds.
                format: int64
                type: integer
              scope:
                description: Granted scopes separated by spaces.
                type: string
              session_id:
                description: Associated device session identifier when available.
                format: uuid
                type: string
              token_type:
                description: Token type.
                type: string
            required:
              - token_type
              - access_token
              - expires_in
              - refresh_token
              - refresh_token_expires_in
              - scope
            type: object
      description: OAuth token response.
