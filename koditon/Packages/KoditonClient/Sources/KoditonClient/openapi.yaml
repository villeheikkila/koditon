    post:
      description: Revokes a refresh token. Access tokens (JWTs) cannot be revoked server-side and expire naturally. Returns 200 OK even if the token is already invalid.
      operationId: oauth-revoke-create
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                token:
                  description: The token to revoke.
                  type: string
                token_type_hint:
                  description: "Optional hint: 'refresh_token' or 'access_token'."
                  type: string
              required:
                - token
              type: object
        required: true
      responses:
        "200":
          description: Token revoked successfully (or was already invalid).
        "400":
          $ref: "#/components/responses/OAuthError"
        "500":
          $ref: "#/components/responses/OAuthError"
      summary: Revoke an OAuth token (RFC 7009)
