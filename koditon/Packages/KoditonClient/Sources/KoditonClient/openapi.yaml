            - array
            - "null"
      required:
        - target
        - values
      type: object
    SearchOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SearchOutputBody.json
          format: uri
          readOnly: true
          type: string
        page:
          format: int32
          type: integer
        page_size:
          format: int32
          type: integer
        rows:
          items:
            $ref: "#/components/schemas/SearchResultRow"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - rows
        - total
        - page
        - page_size
      type: object
    SearchResultRow:
      additionalProperties: false
      properties:
        address:
          type: string
        area:
          format: double
          type: number
        canonical_id:
          type: string
        city:
          type: string
        headline:
          type: string
        kind:
          type: string
        last_seen_at:
          format: date-time
          type: string
        postal:
          type: string
        price:
          format: int64
          type: integer
        room_layout:
          type: string
        source:
          type: string
        url:
          type: string
      required:
        - canonical_id
        - source
        - kind
      type: object
    SourceClaim:
      additionalProperties: false
      properties:
        claim_scope:
          type: string
        confidence:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        dimension_key:
          type: string
        evidence: {}
        id:
          type: string
        observed_at:
          format: date-time
          type: string
        projection_version:
          type: string
        source_field:
          type: string
        source_id:
          type: string
        source_reliability:
          format: double
          type: number
        source_table:
          type: string
        target:
          $ref: "#/components/schemas/CanonicalTargetRef"
        unit:
          type: string
        updated_at:
          format: date-time
          type: string
        valid_from:
          type: string
        valid_until:
          type: string
        value: {}
        value_kind:
          type: string
      required:
        - id
        - target
        - dimension_key
        - value
        - value_kind
        - claim_scope
        - source_table
        - source_id
        - projection_version
        - confidence
        - source_reliability
        - created_at
        - updated_at
      type: object
    SourceClaimsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SourceClaimsOutputBody.json
          format: uri
          readOnly: true
          type: string
        claims:
          items:
            $ref: "#/components/schemas/SourceClaim"
          type:
            - array
            - "null"
        target:
          $ref: "#/components/schemas/CanonicalTargetRef"
      required:
        - target
        - claims
      type: object
    TargetDocumentsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TargetDocumentsOutputBody.json
          format: uri
          readOnly: true
          type: string
        documents:
          items:
            $ref: "#/components/schemas/PropertyDocumentSummary"
          type:
            - array
            - "null"
        target:
          $ref: "#/components/schemas/CanonicalTargetRef"
      required:
        - target
        - documents
      type: object
    TargetOverview:
      additionalProperties: false
      properties:
        fields:
          items:
            $ref: "#/components/schemas/TargetOverviewField"
          type:
            - array
            - "null"
        related:
          items:
            $ref: "#/components/schemas/TargetOverviewRelated"
          type:
            - array
            - "null"
        sources:
          items:
            $ref: "#/components/schemas/TargetSourceLink"
          type:
            - array
            - "null"
        subtitle:
          type: string
        title:
          type: string
      required:
        - title
      type: object
    TargetOverviewField:
      additionalProperties: false
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - label
        - value
      type: object
    TargetOverviewRelated:
      additionalProperties: false
      properties:
        label:
          type: string
        target:
          $ref: "#/components/schemas/CanonicalTargetRef"
        title:
          type: string
      required:
        - label
        - title
        - target
      type: object
    TargetSourceLink:
      additionalProperties: false
      properties:
        kind:
          type: string
        label:
          type: string
        last_seen_at:
          format: date-time
          type: string
        provider:
          type: string
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
      required:
        - label
        - provider
        - kind
        - title
      type: object
    TranslatedValue:
      additionalProperties: false
      properties:
        translation:
          type: string
        value:
          type: string
      required:
        - value
        - translation
      type: object
    WebSessionRefreshOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WebSessionRefreshOutputBody.json
          format: uri
          readOnly: true
          type: string
        access_token:
          type: string
        access_token_expires_at:
          format: int64
          type: integer
        user_id:
          type: string
      required:
        - access_token
        - access_token_expires_at
        - user_id
      type: object
    WebSessionSignOutOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WebSessionSignOutOutputBody.json
          format: uri
          readOnly: true
          type: string
        ok:
          type: boolean
      required:
        - ok
      type: object
info:
  title: Koditon API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/availability/categories:
    get:
      description: Returns distinct building categories (e.g., Kerrostalo, Rivitalo, Omakotitalo)
      operationId: availability-categories
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableCategoriesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: List available building categories
      x-koditon-scopes:
        - core:read
  /api/v1/availability/locations:
    get:
      description: Returns only locations that have price transaction data available
      operationId: availability-locations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableLocationsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: List municipalities and postal codes with price data
      x-koditon-scopes:
        - core:read
  /api/v1/availability/plots:
    get:
      description: Returns distinct plot ownership types (e.g., Oma, Vuokra)
      operationId: availability-plots
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailablePlotsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: List available plot ownership types
      x-koditon-scopes:
        - core:read
  /api/v1/availability/types:
    get:
      description: Returns distinct apartment types (e.g., Yksiö, Kaksio, Kolmio)
      operationId: availability-types
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableTypesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: List available apartment types
      x-koditon-scopes:
        - core:read
  /api/v1/entity:
    get:
      description: Fetch canonical detail for an ad or housing company by canonical ID or source URL
      operationId: entity-detail
      parameters:
        - description: Canonical ID or source URL
          explode: false
          in: query
          name: id
          required: true
          schema:
            description: Canonical ID or source URL
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDetailOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get entity detail
      tags:
        - Entity
  /api/v1/ping:
    post:
      operationId: ping
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: Echo a message
      x-koditon-scopes:
        - core:read
  /api/v1/postal/cities:
    get:
      operationId: postal-cities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostalCitiesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: List postal municipalities with postal codes
      x-koditon-scopes:
        - core:read
  /api/v1/prices/transactions:
    get:
      operationId: prices-transactions
      parameters:
        - explode: false
          in: query
          name: municipality_id
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: postal_code_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesTransactionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: List price transactions by municipality and postal code
      x-koditon-scopes:
        - core:read
  /api/v1/prices/transactions/filtered:
    get:
      description: Query transactions with multiple postal codes, categories, types, and area ranges
      operationId: prices-transactions-filtered
      parameters:
        - description: Comma-separated list of municipality UUIDs
          explode: false
          in: query
          name: municipality_ids
          schema:
            description: Comma-separated list of municipality UUIDs
            type: string
        - description: Comma-separated list of postal code UUIDs
          explode: false
          in: query
          name: postal_code_ids
          schema:
            description: Comma-separated list of postal code UUIDs
            type: string
        - description: Comma-separated list of categories (e.g., Kerrostalo,Rivitalo)
          explode: false
          in: query
          name: categories
          schema:
            description: Comma-separated list of categories (e.g., Kerrostalo,Rivitalo)
            type: string
        - description: Comma-separated list of types (e.g., Yksiö,Kaksio)
          explode: false
          in: query
          name: types
          schema:
            description: Comma-separated list of types (e.g., Yksiö,Kaksio)
            type: string
        - description: Minimum area in square meters (0 = no minimum)
          explode: false
          in: query
          name: min_area
          schema:
            description: Minimum area in square meters (0 = no minimum)
            format: double
            type: number
        - description: Maximum area in square meters (0 = no maximum)
          explode: false
          in: query
          name: max_area
          schema:
            description: Maximum area in square meters (0 = no maximum)
            format: double
            type: number
        - description: Maximum number of results (default 100)
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of results (default 100)
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricesTransactionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: List price transactions with advanced filters
      x-koditon-scopes:
        - core:read
  /api/v1/property-documents/manager-certificates:
    post:
      description: Stores a manager certificate PDF, optionally attaches it to a canonical target, and queues extraction.
      operationId: property-documents-manager-certificates-upload
      parameters:
        - description: "Optional target type: offering, unit, building, housing_company"
          explode: false
          in: query
          name: target_type
          schema:
            description: "Optional target type: offering, unit, building, housing_company"
            type: string
        - description: Optional target UUID
          explode: false
          in: query
          name: target_id
          schema:
            description: Optional target UUID
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/pdf
            schema:
              properties:
                file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
              required:
                - file
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDocumentAttachOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - profile:write
      summary: Upload manager certificate
      tags:
        - Property Documents
      x-koditon-scopes:
        - profile:write
  /api/v1/property-documents/{id}:
    get:
      description: Returns document metadata and its current target attachment.
      operationId: property-documents-detail
      parameters:
        - description: Property document UUID
          in: path
          name: id
          required: true
          schema:
            description: Property document UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDocumentSummary"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: Get property document
      tags:
        - Property Documents
      x-koditon-scopes:
        - core:read
  /api/v1/property-documents/{id}/attachment:
    put:
      description: Moves a document to a canonical target, or detaches it, and queues projection.
      operationId: property-documents-attachment-set
      parameters:
        - description: Property document UUID
          in: path
          name: id
          required: true
          schema:
            description: Property document UUID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyDocumentAttachModelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDocumentAttachOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - profile:write
      summary: Attach property document
      tags:
        - Property Documents
      x-koditon-scopes:
        - profile:write
  /api/v1/property-documents/{id}/download:
    get:
      description: Downloads the original stored property document bytes
      operationId: property-documents-download
      parameters:
        - description: Property document UUID
          in: path
          name: id
          required: true
          schema:
            description: Property document UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                contentEncoding: base64
                type: string
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                format: int64
                type: integer
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - core:read
      summary: Download property document
      tags:
        - Property Documents
      x-koditon-scopes:
        - core:read
  /api/v1/property-targets/map:
    get:
      description: Returns canonical housing company markers with linked units and offerings.
      operationId: property-targets-map
      parameters:
        - description: Minimum latitude for visible map bounds, 0 = no bounds
          explode: false
          in: query
          name: min_lat
          schema:
            description: Minimum latitude for visible map bounds, 0 = no bounds
            format: double
            type: number
        - description: Minimum longitude for visible map bounds, 0 = no bounds
          explode: false
          in: query
          name: min_lng
          schema:
            description: Minimum longitude for visible map bounds, 0 = no bounds
            format: double
            type: number
        - description: Maximum latitude for visible map bounds, 0 = no bounds
          explode: false
          in: query
          name: max_lat
          schema:
            description: Maximum latitude for visible map bounds, 0 = no bounds
            format: double
            type: number
        - description: Maximum longitude for visible map bounds, 0 = no bounds
          explode: false
          in: query
          name: max_lng
          schema:
            description: Maximum longitude for visible map bounds, 0 = no bounds
            format: double
            type: number
        - description: Search by housing company name, address, city, or postal code
          explode: false
          in: query
          name: q
          schema:
            description: Search by housing company name, address, city, or postal code
            type: string
        - description: Maximum number of housing company markers
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of housing company markers
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyTargetMap"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Map canonical property targets
      tags:
        - Property Model
  /api/v1/property-targets/{targetType}/{targetID}:
    get:
      description: Returns a canonical target with resolved values, renovation events, and attached documents.
      operationId: property-targets-detail
      parameters:
        - description: "Canonical target type: offering, unit, building, housing_company"
          in: path
          name: targetType
          required: true
          schema:
            description: "Canonical target type: offering, unit, building, housing_company"
            type: string
        - description: Canonical target UUID
          in: path
          name: targetID
          required: true
          schema:
            description: Canonical target UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalTargetResource"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get canonical property target
      tags:
        - Property Model
  /api/v1/property-targets/{targetType}/{targetID}/claims:
    get:
      description: Returns source and manual claims attached to the target.
      operationId: property-targets-claims
      parameters:
        - description: "Canonical target type: offering, unit, building, housing_company"
          in: path
          name: targetType
          required: true
          schema:
            description: "Canonical target type: offering, unit, building, housing_company"
            type: string
        - description: Canonical target UUID
          in: path
          name: targetID
          required: true
          schema:
            description: Canonical target UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceClaimsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List source claims
      tags:
        - Property Model
  /api/v1/property-targets/{targetType}/{targetID}/documents:
    get:
      description: Returns documents attached to the target.
      operationId: property-targets-documents
      parameters:
        - description: "Canonical target type: offering, unit, building, housing_company"
          in: path
          name: targetType
          required: true
          schema:
            description: "Canonical target type: offering, unit, building, housing_company"
            type: string
        - description: Canonical target UUID
          in: path
          name: targetID
          required: true
          schema:
            description: Canonical target UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetDocumentsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List target documents
      tags:
        - Property Model
  /api/v1/property-targets/{targetType}/{targetID}/renovation-events:
    get:
      description: Returns typed source and manual renovation events attached to the target.
      operationId: property-targets-renovation-events
      parameters:
        - description: "Canonical target type: offering, unit, building, housing_company"
          in: path
          name: targetType
          required: true
          schema:
            description: "Canonical target type: offering, unit, building, housing_company"
            type: string
        - description: Canonical target UUID
          in: path
          name: targetID
          required: true
          schema:
            description: Canonical target UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenovationEventsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List renovation events
      tags:
        - Property Model
  /api/v1/property-targets/{targetType}/{targetID}/resolve:
    post:
      description: Queues resolution and profile projection for one canonical target.
      operationId: property-targets-resolve
      parameters:
        - description: "Canonical target type: offering, unit, building, housing_company"
          in: path
          name: targetType
          required: true
          schema:
            description: "Canonical target type: offering, unit, building, housing_company"
            type: string
        - description: Canonical target UUID
          in: path
          name: targetID
          required: true
          schema:
            description: Canonical target UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedCanonicalJob"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer:
            - profile:write
      summary: Queue target resolution
      tags:
        - Property Model
      x-koditon-scopes:
        - profile:write
  /api/v1/property-targets/{targetType}/{targetID}/resolved-values:
    get:
      description: Returns resolved dimension values with selected evidence and conflict metadata.
      operationId: property-targets-resolved-values
      parameters:
        - description: "Canonical target type: offering, unit, building, housing_company"
          in: path
          name: targetType
          required: true
          schema:
            description: "Canonical target type: offering, unit, building, housing_company"
            type: string
        - description: Canonical target UUID
          in: path
          name: targetID
          required: true
          schema:
            description: Canonical target UUID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedValuesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List resolved values
      tags:
