info:
  title: Koditon API
  version: 0.1.0
openapi: 3.1.0
paths:
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauth-authorization-server-metadata-get
      responses:
        "200":
          $ref: "#/components/responses/OAuthAuthorizationServerMetadata"
      summary: Get OAuth authorization server metadata
      tags:
        - OAuth
        - Auth
      x-koditon-operation-policy:
        mutation: false
        retry:
          backoff:
            base_delay_ms: 120
            jitter: full
            strategy: exponential
          max_attempts: 2
          respect_retry_after_header: true
          retry_on:
            http_status_codes:
              - 429
              - 502
              - 503
              - 504
            transport_errors: true
  /.well-known/oauth-protected-resource:
    get:
      operationId: oauth-protected-resource-metadata-root-get
      responses:
        "200":
          $ref: "#/components/responses/OAuthProtectedResourceMetadata"
      summary: Get OAuth protected resource metadata (root)
      tags:
        - OAuth
        - Auth
      x-koditon-operation-policy:
        mutation: false
        retry:
          backoff:
            base_delay_ms: 120
            jitter: full
            strategy: exponential
          max_attempts: 2
          respect_retry_after_header: true
          retry_on:
            http_status_codes:
              - 429
              - 502
              - 503
              - 504
            transport_errors: true
  /.well-known/oauth-protected-resource/mcp:
    get:
