version: "3"

tasks:
  docker:build:
    desc: Build the backend production image
    cmds:
      - >-
        docker build --pull
        --build-arg VERSION="${BACKEND_VERSION:-dev}"
        --build-arg COMMIT="$(git -C .. rev-parse --short HEAD)"
        --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        -f ../backend/Dockerfile
        -t ${BACKEND_DOCKER_IMAGE:-koditon-backend:prod}
        ../backend

  docker:push:
    desc: Build and push the backend image to GHCR
    vars:
      GHCR_USER: '{{.GHCR_USER | default "villeheikkila"}}'
      TAG: '{{.TAG | default "latest"}}'
      IMAGE: 'ghcr.io/{{.GHCR_USER}}/koditon-backend:{{.TAG}}'
    cmds:
      - >-
        docker build --pull --platform linux/amd64
        --build-arg VERSION="{{.TAG}}"
        --build-arg COMMIT="$(git -C .. rev-parse --short HEAD)"
        --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        -f ../backend/Dockerfile
        -t {{.IMAGE}}
        ../backend
      - docker push {{.IMAGE}}

  check:env:
    desc: Render production secrets locally and validate compose env interpolation
    cmds:
      - |
        set -euo pipefail
        TMP_ENV="$(mktemp)"
        cleanup() {
          rm -f "${TMP_ENV}"
        }
        trap cleanup EXIT
        export ANSIBLE_LOCAL_TEMP="${TMPDIR:-/tmp}/ansible-local"
        mkdir -p "${ANSIBLE_LOCAL_TEMP}"

        ansible-playbook \
          -i localhost, \
          vps/ansible/render-prod-env.local.yml \
          -c local \
          --vault-password-file vps/scripts/ansible-vault-pass.sh \
          -e output_path="${TMP_ENV}"

        DECRYPTED_ENV_FILE="${TMP_ENV}" docker compose --env-file "${TMP_ENV}" -f docker-compose.prod.yml config -q

  deploy:verify:
    desc: Render production secrets locally and verify backend runtime env requirements
    cmds:
      - task: check:env
      - |
        set -euo pipefail
        TMP_ENV="$(mktemp)"
        cleanup() {
          rm -f "${TMP_ENV}"
        }
        trap cleanup EXIT
        export ANSIBLE_LOCAL_TEMP="${TMPDIR:-/tmp}/ansible-local"
        mkdir -p "${ANSIBLE_LOCAL_TEMP}"

        ansible-playbook \
          -i localhost, \
          vps/ansible/render-prod-env.local.yml \
          -c local \
          --vault-password-file vps/scripts/ansible-vault-pass.sh \
          -e output_path="${TMP_ENV}"

        (
          set -a
          . "${TMP_ENV}"
          set +a
          cd ../backend
          GOCACHE="${TMPDIR:-/tmp}/koditon-build-cache" go run ./cmd/main.go verify-env --all-modes
        )

  deploy:
    desc: Build, push, and deploy backend to production
    vars:
      GHCR_USER: '{{.GHCR_USER | default "villeheikkila"}}'
      HEAD_TAG:
        sh: git -C .. rev-parse --short HEAD
      BACKEND_TAG:
        sh: git -C .. log -1 --format=%h -- backend/
      INFRA_TAG:
        sh: git -C .. log -1 --format=%h -- infra/
    cmds:
      - task: deploy:verify
      - cmd: |
          IMAGE="ghcr.io/{{.GHCR_USER}}/koditon-backend:{{.BACKEND_TAG}}"

          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "==> Backend image already exists for tag {{.BACKEND_TAG}}, skipping build"
          else
            echo "==> Building backend image with tag {{.BACKEND_TAG}}..."
            docker build --pull --platform linux/amd64 \
              --build-arg VERSION="{{.BACKEND_TAG}}" \
              --build-arg COMMIT="{{.HEAD_TAG}}" \
              --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -f ../backend/Dockerfile \
              -t "${IMAGE}" \
              ../backend
            docker push "${IMAGE}"
          fi

          if ! docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "ERROR: backend image not found after build: ${IMAGE}" >&2
            exit 1
          fi
      - cmd: |
          ANSIBLE_TAGS=""
          if [ "{{.INFRA_TAG}}" != "{{.HEAD_TAG}}" ]; then
            echo "==> Infra unchanged, running core role only"
            ANSIBLE_TAGS="--tags core"
          else
            echo "==> Infra changed, running all roles"
          fi
          ansible-playbook \
            -i vps/ansible/inventory.ini \
            vps/ansible/playbook.yml \
            --vault-password-file vps/scripts/ansible-vault-pass.sh \
            -e backend_image_tag={{.BACKEND_TAG}} \
            $ANSIBLE_TAGS

  deploy:compose-up:
    desc: Run just the docker compose up step on the VPS via Ansible
    vars:
      BACKEND_TAG:
        sh: git -C .. log -1 --format=%h -- backend/
    cmds:
      - >-
        ansible-playbook
        -i vps/ansible/inventory.ini
        vps/ansible/playbook.yml
        --vault-password-file vps/scripts/ansible-vault-pass.sh
        --tags core
        --start-at-task "Run docker compose up"
        -e backend_image_tag={{.BACKEND_TAG}}
