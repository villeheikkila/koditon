- name: Ensure base packages are installed
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - python3
      - python3-apt
    update_cache: true
    state: present

- name: Ensure SSH hardening config
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-koditon-vps.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      PubkeyAuthentication yes
      PermitEmptyPasswords no
      MaxAuthTries 3
      LoginGraceTime 30
      AllowUsers {{ ssh_allow_users | join(' ') }}
  notify: Reload sshd

- name: Allow SSH
  ansible.builtin.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP
  ansible.builtin.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  ansible.builtin.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW
  ansible.builtin.ufw:
    state: enabled
    policy: deny

- name: Allow outgoing by default
  ansible.builtin.ufw:
    direction: outgoing
    policy: allow

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Ensure sshd jail is enabled
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Enable unattended-upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Configure apt periodic updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

- name: Configure unattended-upgrades policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
      };

      Unattended-Upgrade::Package-Blacklist {
      };

      Unattended-Upgrade::DevRelease "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      Unattended-Upgrade::SyslogEnable "true";

- name: Ensure apt periodic timers are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Ensure SSH users exist
  ansible.builtin.user:
    name: "{{ item }}"
    groups: sudo
    append: true
    shell: /bin/bash
  loop: "{{ ssh_allow_users }}"

- name: Set deploy password hash (optional)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password: "{{ deploy_password_hash }}"
    update_password: always
  when:
    - deploy_password_hash is defined
    - (deploy_password_hash | string | trim | length) > 0

- name: Ensure sudoers for SSH users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item }}"
    mode: "0440"
    content: "{{ item }} ALL=(ALL) NOPASSWD:ALL"
  loop: "{{ ssh_allow_users }}"
  notify: Reload sudo
