services:
  postgres:
    image: ghcr.io/villeheikkila/maku-postgres:latest
    container_name: koditon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: koditon
    command: ["postgres", "-c", "listen_addresses=*", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=koditon"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d koditon"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
