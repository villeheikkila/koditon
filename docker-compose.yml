version: "3.9"

services:
  postgres:
    image: supabase/postgres:17.6.1.095
    container_name: koditon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: koditon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d koditon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: koditon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
