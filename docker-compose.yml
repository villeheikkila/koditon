services:
  postgres:
    image: ghcr.io/villeheikkila/maku-postgres:latest
    container_name: koditon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: koditon
    command: ["postgres", "-c", "listen_addresses=*", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=koditon"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d koditon"]
      interval: 10s
      timeout: 5s
      retries: 5

  traceway:
    profiles: ["traceway"]
    build:
      context: https://github.com/tracewayapp/traceway.git#backend/v1.7.32
      dockerfile: Dockerfile.sqlite
    container_name: koditon-traceway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${TRACEWAY_JWT_SECRET:-change-this-to-a-secure-secret-at-least-32-chars}
      APP_BASE_URL: ${TRACEWAY_APP_BASE_URL:-http://localhost:8082}
      SQLITE_RETENTION_DAYS: ${TRACEWAY_SQLITE_RETENTION_DAYS:-30}
      SESSION_RECORDING_RETENTION_DAYS: ${TRACEWAY_SESSION_RECORDING_RETENTION_DAYS:-30}
    ports:
      - "8082:80"
    volumes:
      - traceway_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  traceway-otel-collector:
    profiles: ["traceway"]
    image: otel/opentelemetry-collector-contrib:0.145.0
    container_name: koditon-traceway-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      TRACEWAY_PROJECT_TOKEN: ${TRACEWAY_PROJECT_TOKEN:?set TRACEWAY_PROJECT_TOKEN}
    volumes:
      - ./infra/traceway/otel-collector.local.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      traceway:
        condition: service_healthy

volumes:
  postgres_data:
  traceway_data:
