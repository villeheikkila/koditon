version: "3"

dotenv: [".env", "./backend/.env"]

tasks:
  backend:dev:
    desc: Run the server with automatic reload on source/.env changes
    dir: backend
    cmds:
      - reflex --regex='\.go$' --decoration=none --start-service -- sh -c 'go run ./cmd'
    env:
      CGO_ENABLED: "0"

  db:new:
    desc: Create a new timestamped migration (NAME required)
    dir: backend/db/migrations
    cmds:
      - tern new {{.NAME}}
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      DB_PASSWORD: "{{.DB_PASSWORD}}"

  db:migrate:
    desc: Apply all pending migrations to the latest version
    dir: backend/db/migrations
    cmds:
      - tern migrate
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      DB_PASSWORD: "{{.DB_PASSWORD}}"

  db:status:
    desc: Show current migration state
    dir: backend/db/migrations
    cmds:
      - tern status
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      DB_PASSWORD: "{{.DB_PASSWORD}}"

  db:drop:
    desc: Drop the database (WARNING - destructive operation)
    dir: backend
    cmds:
      - psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d postgres -c "DROP DATABASE IF EXISTS {{.DB_NAME}};"
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      PGPASSWORD: "{{.DB_PASSWORD}}"

  db:create:
    desc: Create the database
    dir: backend
    cmds:
      - psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d postgres -c "CREATE DATABASE {{.DB_NAME}};"
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      PGPASSWORD: "{{.DB_PASSWORD}}"

  db:reset:
    desc: Drop, create, and migrate the database (WARNING - destructive operation)
    dir: backend
    cmds:
      - task: db:drop
      - task: db:create
      - task: db:migrate
      - echo "Database reset complete. Run 'task db:generate' to regenerate code."

  db:import:
    desc: Import a data file into the database (FILE required)
    dir: backend
    cmds:
      - psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d {{.DB_NAME}} -f {{.FILE}}
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      PGPASSWORD: "{{.DB_PASSWORD}}"

  db:query:
    desc: Run SQL query from stdin or file (use QUERY="..." or FILE=path/to/file.sql)
    dir: backend
    cmds:
      - |
        {{if .FILE}}
        psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d {{.DB_NAME}} -f {{.FILE}}
        {{else if .QUERY}}
        psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d {{.DB_NAME}} -c "{{.QUERY}}"
        {{else}}
        echo "Error: Either QUERY or FILE must be provided"
        exit 1
        {{end}}
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      PGPASSWORD: "{{.DB_PASSWORD}}"

  db:generate:
    desc: Generate type-safe Go code from SQL queries
    dir: backend
    cmds:
      - sqlc generate -f sqlc.yaml
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      DB_PASSWORD: "{{.DB_PASSWORD}}"
    sources:
      - backend/db/schema/**/*.sql
      - backend/internal/*/queries.sql
    generates:
      - backend/internal/*/db/**/*

  db:dump:
    desc: Create a database backup (optional FILE=path/to/backup.sql, defaults to timestamped file)
    dir: backend
    cmds:
      - |
        {{if .FILE}}
        pg_dump -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d {{.DB_NAME}} -F p -f {{.FILE}}
        echo "Database dumped to {{.FILE}}"
        {{else}}
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        FILENAME="db_backup_${TIMESTAMP}.sql"
        pg_dump -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d {{.DB_NAME}} -F p -f ${FILENAME}
        echo "Database dumped to ${FILENAME}"
        {{end}}
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      PGPASSWORD: "{{.DB_PASSWORD}}"

  client:dev:
    desc: Run the client dev server
    dir: client
    cmds:
      - npm run dev

  client:build:
    desc: Build the client app
    dir: client
    cmds:
      - npm run build

  client:lint:
    desc: Lint the client app
    dir: client
    cmds:
      - npm run lint

  client:preview:
    desc: Preview the built client
    dir: client
    cmds:
      - npm run preview

  expo:start:
    desc: Start the Expo app with required env vars
    dir: client
    cmds:
      - EXPO_OWNER=${EXPO_OWNER} BUNDLE_IDENTIFIER=${BUNDLE_IDENTIFIER} npm run start

  expo:build:ios:
    desc: Build the iOS app locally with required env vars
    dir: client
    cmds:
      - EXPO_OWNER=${EXPO_OWNER} BUNDLE_IDENTIFIER=${BUNDLE_IDENTIFIER} npx expo run:ios --configuration Release

  client:generate:
    desc: Generate the client Expo API client from OpenAPI
    dir: client
    cmds:
      - npm run generate

  docker:build:
    desc: Build Docker image for backend (uses DOCKER_IMAGE from .env)
    dir: backend
    cmds:
      - |
        docker build -t "{{.DOCKER_IMAGE}}" .
        echo "Image built: {{.DOCKER_IMAGE}}"

  docker:push:
    desc: Push Docker image to registry (uses DOCKER_IMAGE from .env)
    dir: backend
    cmds:
      - |
        docker push "{{.DOCKER_IMAGE}}"
        echo "Image pushed: {{.DOCKER_IMAGE}}"

  docker:deploy:
    desc: Build, push Docker image, and trigger Dokploy deployment (uses DOCKER_IMAGE and DOKPLOY_WEBHOOK_URL from .env)
    cmds:
      - task: docker:build
      - task: docker:push
      - task: docker:webhook

  docker:webhook:
    desc: Trigger Dokploy deployment webhook
    cmds:
      - |
        echo "Triggering Dokploy deployment..."
        curl -X POST "{{.DOKPLOY_WEBHOOK_URL}}"
        echo "\nDeployment triggered successfully!"
