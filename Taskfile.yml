version: "3"

dotenv: ["./backend/.env"]

tasks:
  backend:dev:
    desc: Run the server with automatic reload on source/.env changes
    dir: backend
    cmds:
      - reflex --regex='\.go$' --decoration=none --start-service -- sh -c 'go run ./cmd'
    env:
      CGO_ENABLED: "0"

  db:new:
    desc: Create a new timestamped migration (NAME required)
    dir: backend/db/migrations
    cmds:
      - tern new {{.NAME}}
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      DB_PASSWORD: "{{.DB_PASSWORD}}"

  db:migrate:
    desc: Apply all pending migrations to the latest version
    dir: backend/db/migrations
    cmds:
      - tern migrate
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      DB_PASSWORD: "{{.DB_PASSWORD}}"

  db:status:
    desc: Show current migration state
    dir: backend/db/migrations
    cmds:
      - tern status
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      DB_PASSWORD: "{{.DB_PASSWORD}}"

  db:drop:
    desc: Drop the database (WARNING - destructive operation)
    dir: backend
    cmds:
      - psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d postgres -c "DROP DATABASE IF EXISTS {{.DB_NAME}};"
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      PGPASSWORD: "{{.DB_PASSWORD}}"

  db:create:
    desc: Create the database
    dir: backend
    cmds:
      - psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d postgres -c "CREATE DATABASE {{.DB_NAME}};"
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      PGPASSWORD: "{{.DB_PASSWORD}}"

  db:reset:
    desc: Drop, create, and migrate the database (WARNING - destructive operation)
    dir: backend
    cmds:
      - task: db:drop
      - task: db:create
      - task: db:migrate
      - echo "Database reset complete. Run 'task db:generate' to regenerate code."

  db:import:
    desc: Import a data file into the database (FILE required)
    dir: backend
    cmds:
      - psql -h {{.DB_HOST}} -p {{.DB_PORT}} -U {{.DB_USER}} -d {{.DB_NAME}} -f {{.FILE}}
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      PGPASSWORD: "{{.DB_PASSWORD}}"

  db:generate:
    desc: Generate type-safe Go code from SQL queries
    dir: backend
    cmds:
      - sqlc generate -f sqlc.yaml
    env:
      DB_HOST: "{{.DB_HOST}}"
      DB_PORT: "{{.DB_PORT}}"
      DB_NAME: "{{.DB_NAME}}"
      DB_USER: "{{.DB_USER}}"
      DB_PASSWORD: "{{.DB_PASSWORD}}"
    sources:
      - backend/db/schema/**/*.sql
      - backend/internal/*/queries.sql
    generates:
      - backend/internal/*/db/**/*

  client:dev:
    desc: Run the client dev server
    dir: client
    cmds:
      - npm run dev

  client:build:
    desc: Build the client app
    dir: client
    cmds:
      - npm run build

  client:lint:
    desc: Lint the client app
    dir: client
    cmds:
      - npm run lint

  client:preview:
    desc: Preview the built client
    dir: client
    cmds:
      - npm run preview

  client:generate:
    desc: Generate the client API SDK from OpenAPI
    dir: client
    cmds:
      - npm run generate
