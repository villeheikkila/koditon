<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koditon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #1a1a1a; line-height: 1.5; }
        .container { max-width: 720px; margin: 0 auto; padding: 48px 16px; text-align: center; }
        h1 { font-size: 2rem; margin-bottom: 8px; }
        p { color: #666; margin-bottom: 24px; }
        .usage { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; text-align: left; }
        .usage h2 { font-size: 1rem; color: #666; margin-bottom: 12px; }
        code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Koditon</h1>
        <p>View ad and building details by canonical ID.</p>
        <div class="usage">
            <h2>Usage</h2>
            <p>Access entity details at:</p>
            <p><code>/detail/{canonical-id}</code></p>
            <p>For example: <code>/detail/shortcut:ad:12345</code></p>
        </div>
    </div>
</body>
</html>
