version: "2"
sql:
  - engine: postgresql
    database:
      uri: ${DATABASE_URL}
    queries:
      - db/queries/ads
      - db/queries/auth
      - db/queries/frontdoor
      - db/queries/postal
      - db/queries/prices
      - db/queries/runtime
      - db/queries/shortcut
    gen:
      go:
        out: internal/db
        package: db
        sql_package: pgx/v5
        sql_driver: github.com/jackc/pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        query_parameter_limit: 1
        overrides:
          # UUID
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # JSONB
          - db_type: "jsonb"
            go_type:
              type: "json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              type: "json.RawMessage"
          # Timestamptz
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "timestamp with time zone"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamp with time zone"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # Timestamp
          - db_type: "timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # Date
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.date"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # Bigint (int8)
          - db_type: "bigint"
            go_type:
              type: "int64"
          - db_type: "bigint"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "int8"
            go_type:
              type: "int64"
          - db_type: "int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "pg_catalog.int8"
            go_type:
              type: "int64"
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          # Integer (int4)
          - db_type: "integer"
            go_type:
              type: "int32"
          - db_type: "integer"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "int4"
            go_type:
              type: "int32"
          - db_type: "int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int4"
            go_type:
              type: "int32"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          # Float8 (double precision)
          - db_type: "float8"
            go_type:
              type: "float64"
          - db_type: "float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          - db_type: "pg_catalog.float8"
            go_type:
              type: "float64"
          - db_type: "pg_catalog.float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          # Text
          - db_type: "text"
            go_type:
              type: "string"
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.text"
            go_type:
              type: "string"
          - db_type: "pg_catalog.text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          # Boolean
          - db_type: "bool"
            go_type:
              type: "bool"
          - db_type: "bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
          - db_type: "pg_catalog.bool"
            go_type:
              type: "bool"
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
          # Inet
          - db_type: "inet"
            nullable: true
            go_type:
              type: "string"
              pointer: true
    # Vet rules applied via: mise run db:vet.
    # sqlc/db-prepare requires a reachable DATABASE_URL.
    rules:
      - sqlc/db-prepare
      - no-pg-catalog
      - no-delete
      - no-select-star
      - no-seq-scan
      - query-too-costly

rules:
  - name: no-pg-catalog
    message: "Avoid querying pg_catalog system tables directly"
    rule: >-
      query.sql.matches("(?i)\\bpg_catalog\\b") ||
      query.sql.matches("(?i)\\bFROM\\s+pg_\\w+") ||
      query.sql.matches("(?i)\\bJOIN\\s+pg_\\w+")
  - name: no-delete
    message: "DELETE statements must include a WHERE clause"
    rule: >-
      query.sql.matches("(?i)delete\\s+from\\s+\\w+\\s*;")
  - name: no-select-star
    message: "Avoid SELECT *; explicitly name columns so generated types stay stable"
    rule: >-
      query.sql.matches("(?i)select\\s+\\*")
  - name: no-seq-scan
    message: "Query results in a sequential scan on table with >100 rows; consider adding an index"
    rule: >-
      has(postgresql.explain) &&
      postgresql.explain.plan.node_type == "Seq Scan" &&
      postgresql.explain.plan.plan_rows > uint(100)
  - name: query-too-costly
    message: "Query cost estimate exceeds threshold (>10000); consider optimizing"
    rule: >-
      has(postgresql.explain) &&
      postgresql.explain.plan.total_cost > 10000.0
