version: "2"
sql:
  - engine: postgresql
    database:
      uri: "${DATABASE_URL}"
    schema:
      - db/schema.sql
    queries:
      - db/queries/ads
      - db/queries/auth
      - db/queries/frontdoor
      - db/queries/pgmq
      - db/queries/postal
      - db/queries/prices
      - db/queries/shortcut
      - db/queries/taskqueue
    gen:
      go:
        out: internal/db
        package: db
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        emit_params_struct_pointers: true
        query_parameter_limit: 1
        overrides:
          # JSONB
          - db_type: "jsonb"
            go_type:
              type: "json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              type: "json.RawMessage"
          # Text
          - db_type: "text"
            nullable: false
            go_type:
              type: "string"
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.text"
            nullable: false
            go_type:
              type: "string"
          - db_type: "pg_catalog.text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          # Boolean
          - db_type: "bool"
            nullable: false
            go_type:
              type: "bool"
          - db_type: "bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
          - db_type: "pg_catalog.bool"
            nullable: false
            go_type:
              type: "bool"
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
          # Bigint (int8)
          - db_type: "bigint"
            nullable: false
            go_type:
              type: "int64"
          - db_type: "bigint"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "int8"
            nullable: false
            go_type:
              type: "int64"
          - db_type: "int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: false
            go_type:
              type: "int64"
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          # Integer (int4)
          - db_type: "integer"
            nullable: false
            go_type:
              type: "int32"
          - db_type: "integer"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "int4"
            nullable: false
            go_type:
              type: "int32"
          - db_type: "int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: false
            go_type:
              type: "int32"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          # Float8 (double precision)
          - db_type: "float8"
            nullable: false
            go_type:
              type: "float64"
          - db_type: "float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          - db_type: "pg_catalog.float8"
            nullable: false
            go_type:
              type: "float64"
          - db_type: "pg_catalog.float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          # Timestamptz
          - db_type: "timestamptz"
            nullable: false
            go_type:
              type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamp with time zone"
            nullable: false
            go_type:
              type: "time.Time"
          - db_type: "timestamp with time zone"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            nullable: false
            go_type:
              type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # Date
          - db_type: "date"
            nullable: false
            go_type:
              type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "pg_catalog.date"
            nullable: false
            go_type:
              type: "time.Time"
          - db_type: "pg_catalog.date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # Inet
          - db_type: "inet"
            nullable: true
            go_type:
              type: "string"
              pointer: true
