version: "3"

tasks:
  dev:
    desc: Run the server with automatic reload on source/.env changes
    cmds:
      - air
    env:
      CGO_ENABLED: "0"

  db:new:
    desc: Create a new timestamped migration (NAME required)
    cmds:
      - tern new -m db/migrations {{.NAME}}

  db:migrate:
    desc: Apply all pending migrations to the latest version
    cmds:
      - tern migrate --migrations db/migrations

  db:status:
    desc: Show current migration state
    cmds:
      - tern status --migrations db/migrations

  db:create:
    desc: Create the database
    cmds:
      - |
        if [ -n "{{.DATABASE_URL}}" ]; then
          DB_NAME=$(echo '{{.DATABASE_URL}}' | sed 's/.*\///' | sed 's/?.*//')
          POSTGRES_URL=$(echo '{{.DATABASE_URL}}' | sed "s|/${DB_NAME}|/postgres|")
          psql "${POSTGRES_URL}" -c "CREATE DATABASE ${DB_NAME};"
        else
          psql "postgresql://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/postgres" -c "CREATE DATABASE {{.DB_NAME}};"
        fi

  db:import:
    desc: Import a data file into the database (FILE required)
    cmds:
      - |
        if [ -n "{{.DATABASE_URL}}" ]; then
          psql "{{.DATABASE_URL}}" -f {{.FILE}}
        else
          psql "postgresql://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}" -f {{.FILE}}
        fi

  db:query:
    desc: Run SQL query from stdin or file (use QUERY="..." or FILE=path/to/file.sql)
    cmds:
      - |
        if [ -n "{{.DATABASE_URL}}" ]; then
          CONN="{{.DATABASE_URL}}"
        else
          CONN="postgresql://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}"
        fi
        {{if .FILE}}
        psql "${CONN}" -f {{.FILE}}
        {{else if .QUERY}}
        psql "${CONN}" -c "{{.QUERY}}"
        {{else}}
        echo "Error: Either QUERY or FILE must be provided"
        exit 1
        {{end}}

  db:generate:
    desc: Generate type-safe Go code from SQL queries
    cmds:
      - sqlc generate -f sqlc.yaml
    sources:
      - sqlc.yaml
      - internal/*/db/schema.sql
      - internal/*/db/queries.sql
    generates:
      - internal/*/db/*.go

  db:dump:
    desc: Create a database backup (optional FILE=path/to/backup.sql, defaults to timestamped file)
    cmds:
      - |
        if [ -n "{{.DATABASE_URL}}" ]; then
          CONN="{{.DATABASE_URL}}"
        else
          CONN="postgresql://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}"
        fi
        {{if .FILE}}
        pg_dump "${CONN}" -F p -f {{.FILE}}
        echo "Database dumped to {{.FILE}}"
        {{else}}
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        FILENAME="db_backup_${TIMESTAMP}.sql"
        pg_dump "${CONN}" -F p -f ${FILENAME}
        echo "Database dumped to ${FILENAME}"
        {{end}}

  db:schema:
    desc: Dump concise public schema to db/schema.sql
    cmds:
      - |
        if [ -n "{{.DATABASE_URL}}" ]; then
          CONN="{{.DATABASE_URL}}"
        else
          CONN="postgresql://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}"
        fi
        psql -X -A -t -v ON_ERROR_STOP=1 "${CONN}" -f scripts/schema_dump.sql | perl scripts/schema_inline_constraints.pl > db/schema.sql

  docker:build:
    desc: Build Docker image for backend (uses DOCKER_IMAGE from .env)
    cmds:
      - |
        docker build -t "{{.DOCKER_IMAGE}}" .
        echo "Image built: {{.DOCKER_IMAGE}}"

  docker:push:
    desc: Push Docker image to registry (uses DOCKER_IMAGE from .env)
    cmds:
      - |
        docker push "{{.DOCKER_IMAGE}}"
        echo "Image pushed: {{.DOCKER_IMAGE}}"

  docker:deploy:
    desc: Build, push Docker image, and trigger Dokploy deployment (uses DOCKER_IMAGE and DOKPLOY_WEBHOOK_URL from .env)
    cmds:
      - task: docker:build
      - task: docker:push
      - task: docker:webhook

  docker:webhook:
    desc: Trigger Dokploy deployment webhook
    cmds:
      - |
        echo "Triggering Dokploy deployment..."
        curl -X POST "{{.DOKPLOY_WEBHOOK_URL}}"
        echo "\nDeployment triggered successfully!"

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test -v ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - go test -cover ./...

  test:coverage:
    desc: Generate coverage profile
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  tools:install:
    desc: Install dev tools (formatting, linting, vuln scanning)
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/oligot/go-mod-upgrade@latest
      - go install golang.org/x/tools/cmd/goimports@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - go install golang.org/x/tools/cmd/deadcode@latest
      - go install mvdan.cc/gofumpt@latest

  fix:
    desc: Autofix formatting + lints (writes changes)
    cmds:
      - gofumpt -w .
      - goimports -w .
      - golangci-lint run ./... --fix --timeout=5m

  deps:
    desc: Update deps + tidy + check vulns (writes go.mod/go.sum)
    cmds:
      - go get -u ./...
      - go mod tidy
      - govulncheck ./...

  update-dependencies:
    desc: Interactive dependency updater
    cmds:
      - go-mod-upgrade

  fmt:
    desc: Check formatting (no writes)
    cmds:
      - test -z "$(gofumpt -l .)" || (echo "gofumpt needed"; gofumpt -l .; exit 1)
      - test -z "$(goimports -l .)" || (echo "goimports needed"; goimports -l .; exit 1)

  lint:
    desc: Run static analysis (no writes)
    cmds:
      - golangci-lint run ./... --timeout=5m

  deadcode:
    desc: Find unreachable functions
    cmds:
      - deadcode ./...

  vuln:
    desc: Check known vulnerabilities (no writes)
    cmds:
      - govulncheck ./...

  tidy:
    desc: Tidy modules (writes go.mod/go.sum)
    cmds:
      - go mod tidy

  tidy:check:
    desc: Ensure go.mod/go.sum are tidy (no net changes)
    cmds:
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  build:
    desc: Build production binary
    cmds:
      - go build -o server ./cmd
    env:
      CGO_ENABLED: "0"

  clean:
    desc: Remove built artifacts
    cmds:
      - rm -f server
      - rm -f coverage.out coverage.html
